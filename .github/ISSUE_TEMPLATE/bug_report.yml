name: Bug report
description: Report a bug or unexpected behaviour
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Reproducer
      description: Optional minimal code snippet or test reproducing the issue.
      render: java
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Stack trace or Testcontainers log output, if any.
      render: shell
    validations:
      required: false
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Please specify the environment details below.
      value: |
        - Module version:
        - Moto image tag:
        - Java version:
        - Docker runtime (e.g. Docker Desktop, Colima, OrbStack):
    validations:
      required: true
