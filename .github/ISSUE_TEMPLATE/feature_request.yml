name: Feature request
description: Suggest an idea or feature for testcontainers-moto
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Optional description of the proposed solution or API design.
    validations:
      required: false
